[project]
name = "toy"
version = "0.1.0"
description = "RpCN toy example"
authors = [
    { name = "Taos Transue", email = "taos.transue@utah.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "einops>=0.8.2",
    "marimo>=0.23.3",
    "matplotlib>=3.10",
    "numpy>=2.0",
    "polars[pyarrow]>=1.40.1",
    "seaborn>=0.13.2",
    "torch>=2.11.0",
    "ttg>=0.1.0",
]

[tool.uv]
package = false
index-strategy = "unsafe-best-match"
link-mode = "symlink"

[tool.uv.sources]
torch = [
    { index = "pytorch" },
]
ttg = [
    { path = "../new-pkg-impl", editable = true },
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
